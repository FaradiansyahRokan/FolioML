version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      # This allows the container to talk to Ollama running on your host machine
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    volumes:
      # Optional: To persist sqlite db if you move it to a specific directory
      - ./backend:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      # The browser needs to know how to reach the backend from outside Docker
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
    depends_on:
      - backend
